# Every push to main: test, build Linux, Windows, macOS and Android, and push each build
# to its itch.io channel with butler. Also runs by hand from the Actions tab.
# README.md, Rilis ke itch.io, lists the secret and variable it needs.
name: itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older one still running, so itch never gets builds out of order.
concurrency:
  group: itch
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build:
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - channel: linux
            os: ubuntu-latest
          - channel: windows
            os: windows-latest
          - channel: mac
            os: macos-latest
          - channel: android
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - if: matrix.channel == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - if: matrix.channel == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - run: flutter pub get

      - name: Build
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir dist
          case ${{ matrix.channel }} in
            linux)
              flutter build linux --release
              cp -r build/linux/x64/release/bundle/. dist/ ;;
            windows)
              flutter build windows --release
              cp -r build/windows/x64/runner/Release/. dist/
              # The MSVC runtime, for players who don't have the redistributable installed.
              for dll in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
                cp "/c/Windows/System32/$dll" dist/
              done ;;
            mac)
              flutter build macos --release
              cp -R "build/macos/Build/Products/Release/Metro Kota.app" dist/ ;;
            android)
              if [ -n "$KEYSTORE_BASE64" ]; then
                keystore="$RUNNER_TEMP/release.jks"
                printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
                {
                  printf 'storeFile=%s\n' "$keystore"
                  printf 'storePassword=%s\n' "$STORE_PASSWORD"
                  printf 'keyAlias=%s\n' "$KEY_ALIAS"
                  printf 'keyPassword=%s\n' "$KEY_PASSWORD"
                } > android/key.properties
              else
                echo "::warning::No ANDROID_KEYSTORE_BASE64: the APK is debug-signed and can't update an earlier install"
              fi
              flutter build apk --release
              rm -f android/key.properties "$RUNNER_TEMP/release.jks"
              cp build/app/outputs/flutter-apk/app-release.apk dist/metro-kota.apk ;;
          esac
          # Artifacts drop the executable bit and symlinks (the Linux binary, the .app's
          # frameworks): a tar keeps them.
          tar -cf build.tar -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: itch-${{ matrix.channel }}
          path: build.tar
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      ITCH_GAME: ${{ vars.ITCH_GAME }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the itch.io settings
        run: |
          [ -n "$BUTLER_API_KEY" ] || { echo "::error::The secret BUTLER_API_KEY is not set"; exit 1; }
          [ -n "$ITCH_GAME" ] || { echo "::error::The variable ITCH_GAME (user/game) is not set"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Install butler
        run: |
          curl -sSfL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"

      - name: Push to itch.io
        run: |
          # pubspec's X.Y.Z plus the run number, e.g. 1.0.0.42
          version="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml).${{ github.run_number }}"
          for channel in linux windows mac android; do
            mkdir "push-$channel"
            tar -xf "builds/itch-$channel/build.tar" -C "push-$channel"
            butler push "push-$channel" "$ITCH_GAME:$channel" --userversion "$version"
          done
